name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flight Simulator APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm install

      - name: Build production web app
        run: npm run build

      - name: Generate and sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure landscape fullscreen & hardware acceleration
        run: |
          node << 'EOF'
          const fs = require("fs");
          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          let xml = fs.readFileSync(manifestPath, "utf8");
          if (!xml.includes("android:hardwareAccelerated")) {
            xml = xml.replace("<application", '<application android:hardwareAccelerated="true"');
          }
          if (!xml.includes("android:screenOrientation")) {
            xml = xml.replace("<activity", '<activity android:screenOrientation="sensorLandscape"');
          }
          fs.writeFileSync(manifestPath, xml, "utf8");
          EOF

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK output
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/flight-sim-megatron-debug.apk

      - name: Build Signed Release APK (if keystore secret is set)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No release keystore secret configured; skipping signed release APK."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/release-keystore.jks
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          cp app/build/outputs/apk/release/app-release.apk ../release-apks/flight-sim-megatron-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flight-sim-megatron-apk
          path: release-apks/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
