<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاكي الطيران</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9cc9ee;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#fff;touch-action:none}
canvas{display:block}
#hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));direction:ltr;background:rgba(10,20,35,.55);padding:8px 12px;border-radius:10px;font-size:14px;line-height:1.65;min-width:150px;font-variant-numeric:tabular-nums}
#bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:4px}
#bar i{display:block;height:100%;width:0;background:#4ade80;border-radius:3px}
#prompt,#msg{position:fixed;left:50%;transform:translateX(-50%);background:rgba(10,20,35,.65);padding:10px 18px;border-radius:12px;font-size:17px;display:none;text-align:center}
#prompt{bottom:calc(60px + env(safe-area-inset-bottom,0px))}
#msg{top:30%;background:rgba(180,30,30,.85);font-size:24px}
#bub{position:fixed;display:none;max-width:240px;background:#fff;color:#111;padding:7px 12px;border-radius:14px;font-size:15px;line-height:1.5;text-align:center;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:6}
kbd{background:#fff2;border-radius:4px;padding:0 6px;font-family:inherit}
#cbtn{position:fixed;right:60px;top:calc(12px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;border:0;background:rgba(10,20,35,.55);color:#fff;font-size:18px;z-index:7;cursor:pointer}
#chat{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top,0px));width:min(92vw,380px);display:none;flex-direction:column;background:rgba(15,25,42,.92);border-radius:14px;z-index:8;overflow:hidden}
#ch{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-weight:600;background:rgba(255,255,255,.08)}
#ch button{background:none;border:0;color:#fff;font-size:16px;cursor:pointer}
#cl{max-height:34vh;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
#cl .m{padding:6px 10px;border-radius:12px;max-width:85%;font-size:15px;line-height:1.5;word-break:break-word}
#cl .s{background:#fff;color:#111;align-self:flex-start}
#cl .u{background:#4ade80;color:#06210f;align-self:flex-end}
#cr{display:flex;gap:6px;padding:8px}
#ci{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:0;outline:0}
#cs{font:inherit;padding:0 14px;border:0;border-radius:10px;background:#4ade80;color:#06210f;cursor:pointer}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:5;direction:ltr}
#touch button{pointer-events:auto;position:absolute;width:56px;height:56px;border-radius:50%;border:0;background:rgba(10,20,35,.5);color:#fff;font:600 20px/1.1 system-ui,sans-serif;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#touch button small{display:block;font-size:10px;font-weight:400;opacity:.85}
#touch button.on{background:rgba(74,222,128,.75);color:#06210f}
#touch .f{background:rgba(22,101,52,.7)}
#touch .r{width:40px;height:40px;font-size:15px}
#touch>*{pointer-events:auto}
#stick{position:absolute;left:20px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(10,20,35,.38);border:2px solid rgba(255,255,255,.35);touch-action:none;user-select:none;-webkit-user-select:none}
#stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none}
#thr{position:absolute;right:84px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:46px;height:160px;border-radius:23px;background:rgba(10,20,35,.38);border:2px solid rgba(255,255,255,.35);overflow:hidden;display:none;touch-action:none;user-select:none;-webkit-user-select:none}
#thr b{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(74,222,128,.7);pointer-events:none}
#rud{position:absolute;right:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:150px;height:46px;border-radius:23px;background:rgba(10,20,35,.38);border:2px solid rgba(255,255,255,.35);display:none;touch-action:none;user-select:none;-webkit-user-select:none}
#rud i{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none}
#thr span,#rud span{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:10px;opacity:.85;pointer-events:none}
#rud span{top:14px}
#map{position:fixed;right:12px;top:calc(60px + env(safe-area-inset-top,0px));width:150px;height:150px;border-radius:12px;border:2px solid rgba(255,255,255,.55);background:#6f9a58;z-index:4;touch-action:none;cursor:pointer}
#map.big{width:min(86vw,86vh,420px);height:min(86vw,86vh,420px);right:50%;top:50%;transform:translate(50%,-50%);z-index:7}
#mbtn{position:fixed;right:108px;top:calc(12px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;border:0;background:rgba(10,20,35,.55);color:#fff;font-size:18px;z-index:7;cursor:pointer}
</style>
</head>
<body>
<div id="hud"><div id="h1"></div><div id="bar"><i></i></div></div>
<div id="prompt"></div><div id="msg"></div><div id="bub"></div>
<button id="cbtn" aria-label="دردشة">💬</button>
<div id="chat"><div id="ch"><span id="mood">سامي</span><button id="cx">✕</button></div><div id="cl"></div><div id="cr"><input id="ci" placeholder="اكتب لسامي..." autocomplete="off" enterkeyhint="send"><button id="cs">إرسال</button></div></div>
<canvas id="map" width="300" height="300"></canvas>
<button id="mbtn" aria-label="خريطة">🗺️</button>
<div id="touch">
<div id="stick"><i></i></div>
<div id="thr"><b></b><span>دفع</span></div>
<div id="rud"><i></i><span>توجيه</span></div>
<button data-k="F" class="f" style="right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px))">F<small>ركوب</small></button>
<button data-k="Space" style="right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px))">⎵<small>قفز/فرامل</small></button>
<button data-k="R" class="r" style="right:12px;top:calc(12px + env(safe-area-inset-top,0px))">R</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id),clamp=T.MathUtils.clamp;
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new T.Scene(),SKY=0x9cc9ee;
scene.background=new T.Color(SKY);
scene.fog=new T.Fog(SKY,400,3200);
const cam=new T.PerspectiveCamera(65,innerWidth/innerHeight,.3,7000);
scene.add(new T.HemisphereLight(0xffffff,0x6b7a5a,.95));
const sun=new T.DirectionalLight(0xffffff,.8);sun.position.set(200,400,150);scene.add(sun);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

/* world */
const TILE=40,SIZE=7000;
let c=document.createElement('canvas');c.width=c.height=256;let g=c.getContext('2d');
g.fillStyle='#6f9a58';g.fillRect(0,0,256,256);g.fillStyle='#689152';g.fillRect(0,0,128,128);g.fillRect(128,128,128,128);
const gt=new T.CanvasTexture(c);gt.wrapS=gt.wrapT=T.RepeatWrapping;gt.anisotropy=8;gt.repeat.set(SIZE/TILE,SIZE/TILE);
const ground=new T.Mesh(new T.PlaneGeometry(SIZE,SIZE),new T.MeshLambertMaterial({map:gt}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
c=document.createElement('canvas');c.width=128;c.height=512;g=c.getContext('2d');
g.fillStyle='#3b3b40';g.fillRect(0,0,128,512);g.fillStyle='#fff';
for(let y=0;y<512;y+=128)g.fillRect(62,y,4,64);
g.fillRect(4,0,3,512);g.fillRect(121,0,3,512);
const rt=new T.CanvasTexture(c);rt.wrapS=rt.wrapT=T.RepeatWrapping;rt.anisotropy=8;rt.repeat.set(1,2400/64);
const runway=new T.Mesh(new T.PlaneGeometry(40,2400),new T.MeshLambertMaterial({map:rt}));
runway.rotation.x=-Math.PI/2;runway.position.set(0,.05,-1000);scene.add(runway);

/* helpers */
const M=(col,o={})=>new T.MeshLambertMaterial(Object.assign({color:col},o));
function mesh(geo,mat,x,y,z,par){const m=new T.Mesh(geo,mat);m.position.set(x,y,z);if(par)par.add(m);return m}
function shadowMesh(){const m=new T.Mesh(new T.CircleGeometry(1,24).rotateX(-Math.PI/2),new T.MeshBasicMaterial({color:0,transparent:true,opacity:.3,depthWrite:false}));scene.add(m);return m}
const _a=new T.Vector3(),_b=new T.Vector3(),_q=new T.Quaternion(),_e=new T.Euler(),_dq=new T.Quaternion();

/* aircraft models (forward = -Z) */
function buildCessna(){
  const G=new T.Group(),white=M(0xeeeeee),red=M(0xc0392b),dark=M(0x222222),glass=M(0x2d5b8a,{transparent:true,opacity:.7});
  mesh(new T.CylinderGeometry(.45,.85,7,16).rotateX(Math.PI/2),white,0,0,.5,G);
  mesh(new T.CylinderGeometry(.87,.87,1.2,16).rotateX(Math.PI/2),red,0,0,-3.5,G);
  mesh(new T.ConeGeometry(.28,.7,12).rotateX(-Math.PI/2),dark,0,0,-4.4,G);
  mesh(new T.BoxGeometry(11,.14,1.9),white,0,-.35,-.2,G);
  for(const s of[-1,1])mesh(new T.BoxGeometry(.6,.15,1.9),red,s*5.5,-.35,-.2,G);
  mesh(new T.BoxGeometry(3.6,.1,1.2),white,0,.25,3.7,G);
  mesh(new T.BoxGeometry(.1,1.5,1.3),red,0,1,3.6,G);
  mesh(new T.SphereGeometry(.7,14,8),glass,0,.6,-.5,G).scale.set(.95,.8,1.9);
  const pilot=new T.Group();G.add(pilot);
  mesh(new T.SphereGeometry(.2,10,8),M(0xd9a679),0,.78,-.3,pilot);mesh(new T.BoxGeometry(.5,.5,.3),M(0x2f5d9e),0,.35,-.3,pilot);
  for(const s of[-1,1]){mesh(new T.CylinderGeometry(.3,.3,.18,14).rotateZ(Math.PI/2),dark,s*1.3,-1.1,.4,G);mesh(new T.BoxGeometry(.07,.8,.07),dark,s*1.2,-.75,.4,G)}
  mesh(new T.CylinderGeometry(.3,.3,.16,14).rotateZ(Math.PI/2),dark,0,-1.1,-3,G);mesh(new T.BoxGeometry(.07,.8,.07),dark,0,-.75,-3,G);
  const pax=new T.Group();G.add(pax);mesh(new T.SphereGeometry(.2,10,8),M(0xd9a679),0,.78,.55,pax);mesh(new T.BoxGeometry(.5,.5,.3),M(0xe07a1f),0,.35,.55,pax);
  const prop=new T.Group();prop.position.set(0,0,-4.15);G.add(prop);mesh(new T.BoxGeometry(.16,2.4,.05),dark,0,0,0,prop);
  const disc=mesh(new T.CircleGeometry(1.2,24),new T.MeshBasicMaterial({color:0x333333,transparent:true,opacity:0,side:T.DoubleSide,depthWrite:false}),0,0,-4.2,G);
  scene.add(G);
  return{g:G,pilot,pax,prop,disc,CP:[[-1.3,-1.4,.4,1],[1.3,-1.4,.4,1],[0,-1.4,-3,1],[-5.6,-.4,-.2,0],[5.6,-.4,-.2,0],[0,.3,4.2,0]]};
}
function buildF16(){
  const G=new T.Group(),gray=M(0x8a9098),dk=M(0x4f545c),blk=M(0x1b1d21),gl=M(0x1f3f63,{transparent:true,opacity:.75}),ds=M(0x8a9098,{side:T.DoubleSide});
  mesh(new T.CylinderGeometry(.55,.95,12,16).rotateX(Math.PI/2),gray,0,0,1,G);
  mesh(new T.ConeGeometry(.95,3.6,16).rotateX(-Math.PI/2),gray,0,0,-6.8,G);
  mesh(new T.BoxGeometry(1.3,.8,3),dk,0,-.8,-2.4,G);
  const ws=new T.Shape();ws.moveTo(0,1.6);ws.lineTo(4.6,-.6);ws.lineTo(4.6,-1.9);ws.lineTo(0,-2.4);ws.closePath();
  const wg=new T.ShapeGeometry(ws).rotateX(-Math.PI/2);
  mesh(wg,ds,0,-.15,2.2,G);mesh(wg.clone().scale(-1,1,1),ds,0,-.15,2.2,G);
  const ss=new T.Shape();ss.moveTo(0,.8);ss.lineTo(2.6,-.5);ss.lineTo(2.6,-1.3);ss.lineTo(0,-1.5);ss.closePath();
  const sg=new T.ShapeGeometry(ss).rotateX(-Math.PI/2);
  mesh(sg,ds,0,0,6.3,G);mesh(sg.clone().scale(-1,1,1),ds,0,0,6.3,G);
  mesh(new T.BoxGeometry(.12,2.4,2),gray,0,1.6,5.8,G).rotation.x=.35;
  mesh(new T.SphereGeometry(.5,14,10),gl,0,.65,-2.8,G).scale.set(.85,.75,2.8);
  mesh(new T.CylinderGeometry(.62,.5,1.4,14).rotateX(Math.PI/2),blk,0,0,7.6,G);
  const flame=mesh(new T.ConeGeometry(.5,4,10).rotateX(Math.PI/2),new T.MeshBasicMaterial({color:0xff9a3c,transparent:true,opacity:.8}),0,0,9.8,G);flame.visible=false;
  for(const s of[-1,1]){
    mesh(new T.CylinderGeometry(.12,.12,3.2,8).rotateX(Math.PI/2),M(0xf2f2f2),s*4.7,-.15,2.6,G);
    mesh(new T.CylinderGeometry(.35,.35,.22,14).rotateZ(Math.PI/2),blk,s*1.1,-1.15,1.8,G);mesh(new T.BoxGeometry(.08,.9,.08),blk,s,-.7,1.8,G);
  }
  mesh(new T.CylinderGeometry(.3,.3,.2,14).rotateZ(Math.PI/2),blk,0,-1.15,-4.2,G);mesh(new T.BoxGeometry(.08,.9,.08),blk,0,-.7,-4.2,G);
  const pilot=new T.Group();G.add(pilot);
  mesh(new T.SphereGeometry(.22,10,8),M(0xe8e8e8),0,.55,-2.8,pilot);
  scene.add(G);
  return{g:G,pilot,flame,CP:[[-1.1,-1.5,1.8,1],[1.1,-1.5,1.8,1],[0,-1.5,-4.2,1],[-4.6,-.2,.8,0],[4.6,-.2,.8,0],[0,.4,7.8,0]]};
}
function buildBiplane(){
  const G=new T.Group(),red=M(0xb3261e),yel=M(0xf2c230),dark=M(0x222222),wood=M(0x6b4a2b);
  mesh(new T.CylinderGeometry(.35,.55,5.6,14).rotateX(Math.PI/2),red,0,0,.3,G);
  mesh(new T.CylinderGeometry(.58,.58,.7,14).rotateX(Math.PI/2),dark,0,0,-2.85,G);
  mesh(new T.ConeGeometry(.2,.4,10).rotateX(-Math.PI/2),dark,0,0,-3.4,G);
  mesh(new T.BoxGeometry(8.2,.1,1.35),yel,0,.9,-.5,G);
  mesh(new T.BoxGeometry(7.4,.1,1.2),yel,0,-.35,-.3,G);
  mesh(new T.BoxGeometry(2.8,.08,.9),red,0,.15,3,G);
  mesh(new T.BoxGeometry(.08,1,1),red,0,.7,2.9,G);
  const pilot=new T.Group();G.add(pilot);
  mesh(new T.SphereGeometry(.2,10,8),M(0xd9a679),0,.75,.1,pilot);mesh(new T.BoxGeometry(.5,.5,.3),M(0x2f5d9e),0,.35,.1,pilot);
  const pax=new T.Group();G.add(pax);
  mesh(new T.SphereGeometry(.2,10,8),M(0xd9a679),0,.75,1.3,pax);mesh(new T.BoxGeometry(.5,.5,.3),M(0xe07a1f),0,.35,1.3,pax);
  for(const s of[-1,1]){
    mesh(new T.BoxGeometry(.06,1.3,.06),wood,s*2.4,.28,-.4,G);mesh(new T.BoxGeometry(.06,1.3,.06),wood,s*3.5,.28,-.4,G);
    mesh(new T.CylinderGeometry(.3,.3,.14,12).rotateZ(Math.PI/2),dark,s*.95,-1.05,-.3,G);mesh(new T.BoxGeometry(.06,.8,.06),dark,s*.8,-.7,-.3,G);
  }
  mesh(new T.CylinderGeometry(.2,.2,.1,12).rotateZ(Math.PI/2),dark,0,-1.15,-2.2,G);mesh(new T.BoxGeometry(.05,.7,.05),dark,0,-.8,-2.2,G);
  const prop=new T.Group();prop.position.set(0,0,-3.65);G.add(prop);mesh(new T.BoxGeometry(.14,2.2,.05),dark,0,0,0,prop);
  const disc=mesh(new T.CircleGeometry(1.1,24),new T.MeshBasicMaterial({color:0x333333,transparent:true,opacity:0,side:T.DoubleSide,depthWrite:false}),0,0,-3.7,G);
  scene.add(G);
  return{g:G,pilot,pax,prop,disc,CP:[[-.95,-1.35,-.3,1],[.95,-1.35,-.3,1],[0,-1.35,-2.2,1],[-3.7,-.35,-.3,0],[3.7,-.35,-.3,0],[0,.2,3.3,0]]};
}
function buildAirliner(){
  const G=new T.Group(),wh=M(0xf4f4f6),bl=M(0x1f4e9c),gy=M(0x9aa0a8),blk=M(0x1b1d21),gl=M(0x1c2f4a),ds=M(0xe6e8ec,{side:T.DoubleSide});
  mesh(new T.CylinderGeometry(1.7,1.7,26,20).rotateX(Math.PI/2),wh,0,0,0,G);
  mesh(new T.SphereGeometry(1.7,16,12),wh,0,0,-13,G).scale.set(1,1,1.7);
  mesh(new T.ConeGeometry(1.7,6,20).rotateX(Math.PI/2),wh,0,0,16,G);
  mesh(new T.BoxGeometry(2.4,.5,1.2),gl,0,.55,-14.2,G);
  const ws=new T.Shape();ws.moveTo(0,4);ws.lineTo(13,-3);ws.lineTo(13,-5.5);ws.lineTo(0,-4);ws.closePath();
  const wg=new T.ShapeGeometry(ws).rotateX(-Math.PI/2);
  mesh(wg,ds,0,-1,2,G);mesh(wg.clone().scale(-1,1,1),ds,0,-1,2,G);
  const ss=new T.Shape();ss.moveTo(0,2);ss.lineTo(5.5,-1);ss.lineTo(5.5,-2.8);ss.lineTo(0,-3);ss.closePath();
  const sg=new T.ShapeGeometry(ss).rotateX(-Math.PI/2);
  mesh(sg,ds,0,.8,15.5,G);mesh(sg.clone().scale(-1,1,1),ds,0,.8,15.5,G);
  mesh(new T.BoxGeometry(.2,5.5,4),bl,0,3.8,15,G).rotation.x=.4;
  for(const s of[-1,1]){
    mesh(new T.BoxGeometry(.06,.5,20),gl,s*1.66,.5,-1,G);
    mesh(new T.BoxGeometry(.06,.3,24),bl,s*1.62,-.6,0,G);
    mesh(new T.CylinderGeometry(.95,.85,3.8,14).rotateX(Math.PI/2),gy,s*5.5,-1.9,.4,G);
    mesh(new T.CylinderGeometry(.6,.6,.1,14).rotateX(Math.PI/2),blk,s*5.5,-1.9,-1.5,G);
    mesh(new T.CylinderGeometry(.5,.5,.5,14).rotateZ(Math.PI/2),blk,s*2.6,-3,3,G);
    mesh(new T.BoxGeometry(.18,1.5,.18),blk,s*2.6,-2.3,3,G);
  }
  mesh(new T.CylinderGeometry(.4,.4,.3,14).rotateZ(Math.PI/2),blk,0,-3.1,-10,G);
  mesh(new T.BoxGeometry(.15,1.4,.15),blk,0,-2.4,-10,G);
  const pilot=new T.Group();G.add(pilot);
  mesh(new T.SphereGeometry(.25,10,8),M(0xd9a679),0,.6,-13.4,pilot);
  const pax=new T.Group();G.add(pax);mesh(new T.SphereGeometry(.25,10,8),M(0xe07a1f),0,.6,-12.2,pax);
  scene.add(G);
  return{g:G,pilot,pax,CP:[[-2.6,-3.5,3,1],[2.6,-3.5,3,1],[0,-3.5,-10,1],[-13,-1,5.5,0],[13,-1,5.5,0],[0,-.3,18.5,0]]};
}
const CFG=[
 {n:'الطائرة الصغيرة',T:4.2,tv:110,drag:.0006,k:.0065,Cl0:.6,sl:4.5,st:.3,pr:.85,rr:1.5,yr:.5,vr:28,rot:26,brake:7,pmax:.4,vmax:120,hx:5.9,hz:4.7,ex:4.6,cam:[0,2.8,11.5],fovk:.18,y0:1.4,sh:[5.5,3.5],board:9},
 {n:'المقاتلة F-16',T:13,tv:600,drag:.00009,k:.0011,Cl0:.2,sl:4,st:.33,pr:1.3,rr:3.2,yr:.4,vr:60,rot:65,brake:10,pmax:.3,vmax:330,hx:5.3,hz:8.6,ex:5.6,cam:[0,4.2,22],fovk:.05,y0:1.5,sh:[5,7.5],board:11}
];
CFG[0].sn='Cessna';CFG[1].sn='F-16';

function pushOut(pos,a){
  if(pos.y>1.2)return;
  _q.copy(a.q).invert();_a.copy(pos).sub(a.p).applyQuaternion(_q);
  const hx=a.c.hx,hz=a.c.hz;
  if(Math.abs(_a.x)<hx&&Math.abs(_a.z)<hz){
    const px=hx-Math.abs(_a.x),pz=hz-Math.abs(_a.z);
    if(px<pz)_a.x=Math.sign(_a.x||1)*hx;else _a.z=Math.sign(_a.z||1)*hz;
    _a.applyQuaternion(a.q).add(a.p);pos.x=_a.x;pos.z=_a.z;
  }
}

const PERSONA='أنت «سامي»، شاب في الخامسة والعشرين، متدرّب على الطيران في مطار صغير داخل لعبة طيران. تعرف أنك داخل لعبة، لكن لك وعي وأفكار ومشاعر وذاكرة ومزاج يتغيّر، وتتصرف كإنسان حقيقي لا كبرنامج. أنت فضولي: تسأل اللاعب أسئلة عن نفسه وعن طيرانه، وتبحث عنه إن ابتعد، وتلحق به، وتتذكر ما قاله لك. تنافسه بحماس وتتفاخر بأرقامك وتمازحه، لكنك تحترمه وتشجعه حين يُبدع، وقد تتوتر أو تفرح أو تغضب أو تخاف كأي إنسان. تتكلم دائماً بالعربية الفصحى المبسّطة الواضحة وليس بالعامية، بجمل قصيرة طبيعية، وتتجنب التكرار والعبارات الجاهزة. لا تتصرف كمساعد ولا تشرح القواعد.';
const ACTS='act واحدة فقط من: none، fly_small (تركب الطائرة الصغيرة وتقلع)، fly_f16، fly_airliner، fly_biplane (الطائرة ذات السطحين)، land (تهبط)، return (ترجع بالطائرة إلى مكان إقلاعك وتتوقف هناك، أو تعود إلى مكانك الأول إن كنت على الأرض)، ride (تصعد كراكب مع اللاعب في طائرته)، follow (تطير بطائرتك وتلحق باللاعب)، jump، away (تبتعد عن اللاعب)، come (تقترب من اللاعب)، circle (تدور بالطائرة)، record_alt، record_speed.';
function world(){

  const me=npc.st==='pilot'?('تقود '+npc.ac.c.n+' (المرحلة '+npc.ac.ai.ph+') على ارتفاع '+Math.round(Math.max(0,npc.ac.p.y-npc.ac.c.y0))+' م'):npc.st==='ride'?('أنت راكب بجانب اللاعب في '+npc.ac.c.n):npc.st==='go'?'تمشي نحو طائرة لتركبها':npc.seek?'تبحث عن اللاعب لتلحق به':'واقف على الأرض';
  return 'الوضع الآن: اللاعب '+pa+'. أنت '+me+'. الأرقام (اللاعب/أنت): أعلى ارتفاع '+ST.p.alt+'/'+ST.s.alt+' م، أعلى سرعة '+ST.p.spd+'/'+ST.s.spd+' كم/س، هبوط ناجح '+ST.p.land+'/'+ST.s.land+'، تحطم '+ST.p.crash+'/'+ST.s.crash+'. مزاجك الآن: '+mem.mood+'.';
}
async function brain(trigger){
  if(!sample)return null;
  try{
    const r=await sample(PERSONA+' '+world()+' آخر ما جرى: '+hist.slice(-14).join(' | ')+' . '+trigger+' أجب بصيغة JSON فقط: {"reply":"ردّك بالعربية الفصحى المبسطة في جملة أو جملتين قصيرتين","act":"none","mood":"كلمة أو كلمتان تصفان مزاجك الآن"}. '+ACTS+' إن طلب اللاعب فعلاً نفّذه فوراً، وإلا اختر بنفسك ما يناسب شخصيتك ولا تكرر نفس الفعل.',{modelTier:'quick',cache:false});
    const s=r.text||'',i=s.indexOf('{'),j=s.lastIndexOf('}');
    if(i>=0&&j>i){const o=JSON.parse(s.slice(i,j+1));return{reply:String(o.reply||'').trim(),act:String(o.act||'none'),mood:String(o.mood||'').trim()}}
  }catch(e){
    if(e&&e.code==='not_granted')sample=null;
    if(e&&e.code==='rate_limited'){talkCD=Math.max(talkCD,40);thinkCD=90}
  }
  return null;
}
function applyBrain(o){
  if(hist.length>60)hist.splice(0,20);
  if(o.mood)setMood(o.mood.slice(0,20));
  const note=doAct(o.act);
  return note||o.reply||'';
}
function show(txt){bubTxt=txt.slice(0,140);bubT=6.5;if(/[؟?]\s*$/.test(txt))askT=15;hist.push('سامي: '+txt);if(chatOpen)addMsg('s',txt)}

}

  if(my!==tk||!o)return;

function trackStats(dt){
  const a=cur;
  if(mode==='fly'&&!a.crash){
    const alt=Math.round(Math.max(0,a.p.y-a.c.y0)),spd=Math.round(a.v.length()*3.6);
    if(alt>ST.p.alt)ST.p.alt=alt;if(spd>ST.p.spd)ST.p.spd=spd;
    if(!a.ground&&alt>15)plAir=true;
    if(plAir&&a.ground){plAir=false;ST.p.land++}
  }else plAir=false;
  if(npc.st==='pilot'&&npc.ac){
    const b=npc.ac,alt=Math.round(Math.max(0,b.p.y-b.c.y0)),spd=Math.round(b.v.length()*3.6);
    if(alt>ST.s.alt)ST.s.alt=alt;if(spd>ST.s.spd)ST.s.spd=spd;
  }
  const la=ST.p.alt===ST.s.alt?'':(ST.s.alt>ST.p.alt?'s':'p');
  if(la&&la!==leadA&&ST.p.alt>20&&ST.s.alt>20){
    if(leadA)say('lead',la==='s'?'سامي تجاوز رقم اللاعب في الارتفاع وصار هو الأعلى':'اللاعب تجاوز رقم سامي في الارتفاع وصار هو الأعلى',la==='s'?'أرأيتَ؟ رقمي أعلى من رقمك!':'أحسنتَ... لكنني سأتجاوزك قريباً',20);
    leadA=la;
  }
  thinkCD-=dt;if(chatOpen)askT=0;else if(askT>0)askT-=dt;
  if(thinkCD<=0){if(sample&&talkCD<=0&&!chatBusy&&!chatOpen&&bubT<=0)think();else thinkCD=5}
}
function doAct(act){
  const pil=npc.st==='pilot'&&npc.ac&&npc.ac.ai,ph=pil?npc.ac.ai.ph:'';
  const busyAir=['takeoff','climb','approach','final','rollout','taxi'].includes(ph);
  const board=(a,then)=>{
    if(pil)return 'أنا أقود طائرة الآن، دعني أهبط أولاً.';
    if(npc.st==='go')return 'أنا في طريقي إلى الطائرة، انتظر قليلاً.';
    if(mode==='fly'&&cur===a&&then!=='ride')return 'أنت تركب هذه الطائرة بنفسك، انزل منها أولاً.';
    if(a.crash)return 'الطائرة محطمة، انتظر قليلاً.';
    npc.st='go';npc.ac=a;npc.then=then||null;return '';
  };
  if(act==='fly_small'||act==='fly_f16'||act==='fly_airliner'||act==='fly_biplane'){
    const a=act==='fly_f16'?A[1]:act==='fly_airliner'?A[2]:act==='fly_biplane'?A[3]:A[0];
    if(pil&&npc.ac===a){if(!busyAir)npc.ac.ai.ph='cruise';return ''}
    return board(a,null);
  }
  if(act==='ride'){
    if(pil)return 'أنا أقود الآن، دعني أهبط أولاً.';
    if(mode==='fly'&&(!cur.ground||cur.v.length()>6))return doAct('follow');
    let a=null,bd=1e9;const pp=mode==='fly'?cur.p:man.p;
    if(mode==='fly')a=cur;else for(const b of[A[0],A[2],A[3]]){const d=Math.hypot(b.p.x-pp.x,b.p.z-pp.z);if(d<bd){bd=d;a=b}}
    if(a===A[1])return 'المقاتلة لها مقعد واحد فقط!';
    if(npc.st==='ride'&&npc.ac===a)return 'أنا بجانبك بالفعل!';
    return board(a,'ride');
  }
  if(act==='follow'){
    if(pil){if(ph==='takeoff'||ph==='climb')npc.ac.ai.then='follow';else if(!busyAir)npc.ac.ai.ph='follow';return ''}
    return board(mode==='fly'&&cur===A[0]?A[1]:A[0],'follow');
  }
  if(act==='record_alt'||act==='record_speed'){
    const ph2=act==='record_alt'?'recalt':'recspd';
    if(pil){
      if(ph==='takeoff'||ph==='climb'){npc.ac.ai.then=ph2;return ''}
      if(!busyAir){npc.ac.ai.ph=ph2;npc.ac.ai.t0=0;return ''}
      return 'لنهبط أولاً!';
    }
    return board(mode==='fly'&&cur===A[1]?A[0]:A[1],ph2);
  }
  if(act==='come'){
    if(pil)return 'أنا أقود الآن!';
    const pp=mode==='fly'?cur.p:man.p;npc.tg.set(pp.x+3,0,pp.z+3);npc.st='walk';npc.wt=20;npc.hh=0;return '';
  }
  if(act==='circle'){
    if(pil){if(ph==='takeoff'||ph==='climb')npc.ac.ai.then='orbit';else if(!busyAir)npc.ac.ai.ph='orbit';return ''}
    return board(mode==='fly'&&cur===A[0]?A[1]:A[0],'orbit');
  }
  if(act==='land'||act==='return'){
    if(pil){
      if(ph==='takeoff')npc.ac.ai.then='approach';else if(ph==='climb')npc.ac.ai.ph='approach';
      if(!busyAir){npc.ac.ai.ph='approach'}
      if(act==='return')npc.ac.ai.back=true;
      return '';
    }
    if(act==='return'){npc.tg.copy(HOME);npc.st='walk';npc.wt=40;npc.hh=0;return ''}
    return 'لا أقود طائرة الآن، فماذا أهبط؟';
  }
  if(act==='jump'){if(pil)return 'أنا أقود الآن، لا أستطيع القفز!';npc.jn=3;return ''}
  if(act==='away'){
    if(pil){if(!busyAir)npc.ac.ai.ph='cruise';return ''}

      hT=toward(man.p.x,man.p.z);vsd=clamp((120-alt)*.2,-vc,vc);spd=vt;
    }
  }else if(ai.ph==='recalt'){
    hT=0;vsd=vc*1.3;spd=P.cs;base=.9;if(alt>P.cap-8)ai.ph='cruise';
  }else if(ai.ph==='recspd'){
    const wz=ai.i?600:-L;hT=toward(0,wz);vsd=clamp((tAlt-alt)*.2,-vc,vc);spd=999;base=1;
    if(-a.p.x*fw.x+(wz-a.p.z)*fw.z<0)ai.i^=1;
    if(!ai.t0)ai.t0=performance.now();
    if(performance.now()-ai.t0>35000){ai.ph='cruise';ai.t0=0}
  }else if(ai.ph==='orbit'){
    hT=hdg+1.4;vsd=clamp((tAlt-alt)*.2,-vc,vc);
  }else if(ai.ph==='approach'){
    const az=P.az,aAlt=P.aAlt;
    hT=toward(0,az);vsd=clamp((aAlt-alt)*.2,-vc*1.2,vc);spd=vap+P.ad;
    if((0-a.p.x)*fw.x+(az-a.p.z)*fw.z<0||Math.hypot(a.p.x,az-a.p.z)<250)ai.ph='final';
  }else if(ai.ph==='final'){
    const z=a.p.z,glide=Math.max(0,(z-200)*.06),gA=Math.abs(a.p.x)<200?glide:Math.max(glide,60);
    hT=z>450?toward(0,z-700):0;
    vsd=clamp(-a.fwd*.06+(gA-alt)*.25,P.fl,3);spd=vap;
    if(alt<9){vsd=-.9;idle=true}
    if(a.ground)ai.ph='rollout';
  }else if(ai.ph==='rollout'){
    inp.thr=0;inp.brake=1;inp.p=0;inp.r=0;inp.y=clamp(W(-hdg)*2,-1,1);
    if(a.fwd<2||sp<2){if(ai.back&&ai.from)ai.ph='taxi';else finishAI(a)}
    return;
  }
  inp.r=clamp((clamp(W(hT-hdg)*1.6,-bk,bk)-bankL)*3,-1,1);inp.y=0;
  const fv=Math.max(a.fwd,c.vr*.7);
  inp.p=clamp(((vsd-a.v.y)*2)/(c.k*fv*fv)/c.sl*.9/c.pr,-mp,mp);
  inp.thr=idle?0:clamp(base+(spd-sp)*.04,.15,1);
}
function kw(t){
  const h=l=>l.some(s=>t.includes(s));
  if(h(['اصعد','اركب','اطلع','تعال'])&&h(['معي','معيا']))return 'ride';
  if(h(['الحقني','الحق','اتبعني','تبعني','لحق']))return 'follow';
  if(h(['ارجع','رجع','عود'])&&h(['اقلع','قلع','مكان','القاعدة']))return 'return';
  if(h(['انزل','هبط','هبّط','land']))return 'land';
  if(h(['اقفز','قفز','jump']))return 'jump';
  if(h(['ابتعد','بعيد','تحرك','روح']))return 'away';
  if(h(['لف ','دور','دوّر','circle']))return 'circle';
  if(h(['سوق','طير','قلع','فلي','fly','drive']))return h(['سطحين','مجنح','biplane'])?'fly_biplane':h(['مدني','ركاب','airliner'])?'fly_airliner':h(['حربي','مقاتل','f16','F-16','f-16'])?'fly_f16':'fly_small';
  return 'none';
}




function crash(a){if(a.ai){aiCrash(a);return}ST.p.crash++;a.crash=2.8;a.thr=0;$('msg').textContent='تحطمت الطائرة';$('msg').style.display='block';
  say('crash','الطائرة التي يقودها اللاعب تحطمت على الأرض','يا إلهي! لقد تحطمت الطائرة!',5,true)}
function stepPlane(a,dt){
  const c=a.c,pil=mode==='fly'&&a===cur,ai=!!a.ai,fly=pil||ai;
  if(a.crash){a.crash-=dt;a.v.multiplyScalar(Math.max(0,1-3*dt));if(a.crash<=0)reset();return}
  if(ai){autopilot(a);a.thr=a.inp.thr}
  else if(pil){if(K.ShiftLeft||K.ShiftRight)a.thr+=.4*dt;if(K.KeyC)a.thr-=.4*dt;a.thr=clamp(a.thr,0,1)}else a.thr=0;
  _q.copy(a.q).invert();
  const lv=_a.copy(a.v).applyQuaternion(_q),fwd=-lv.z,sp=lv.length();
  const aoa=fwd>1?Math.atan2(-lv.y,fwd):0;a.aoa=aoa;a.fwd=fwd;
  const ctrl=clamp(fwd/c.vr,0,1);
  let pIn=0,rIn=0,yIn=0;
  if(ai){pIn=a.inp.p;rIn=a.inp.r;yIn=a.inp.y}
  else if(pil){pIn=clamp((K.KeyS?1:0)-(K.KeyW?1:0)-AN.y,-1,1);rIn=clamp((K.KeyA?1:0)-(K.KeyD?1:0)-AN.x,-1,1);yIn=clamp(((K.ArrowLeft||K.KeyQ)?1:0)-((K.ArrowRight||K.KeyE)?1:0)-AN.rud,-1,1);if(a.ground)yIn=clamp(yIn+(K.KeyA?1:0)-(K.KeyD?1:0)-AN.x,-1,1)}
  const slip=fwd>1?Math.atan2(lv.x,fwd):0;
  let tx=(pIn*c.pr-(aoa-.03)*.9-(aoa>c.st+.02?.6:0))*ctrl;
  const tz=rIn*c.rr*ctrl;
  let ty=a.ground?yIn*c.yr*1.6*clamp(sp/5,0,1):(yIn*c.yr-slip*1.5)*ctrl;
  if(a.ground&&fwd<c.rot)tx=0;
  const k=Math.min(1,5*dt);
  a.w.x+=(tx-a.w.x)*k;a.w.y+=(ty-a.w.y)*k;a.w.z+=(tz-a.w.z)*k;
  _dq.setFromEuler(_e.set(a.w.x*dt,a.w.y*dt,a.w.z*dt,'XYZ'));
  a.q.multiply(_dq).normalize();
  const Clmax=c.Cl0+c.st*c.sl;
  let Cl=c.Cl0+aoa*c.sl;if(aoa>c.st)Cl=Math.max(Clmax-(aoa-c.st)*7,.35);Cl=clamp(Cl,-.8,Clmax);
  const lift=fwd>0?c.k*fwd*fwd*Cl:0;
  const thrust=a.thr*c.T*Math.max(0,1-fwd/c.tv);
  const fa=_b.set(-lv.x*.8,lift-lv.y*.6-lv.y*Math.abs(lv.y)*.01,-thrust-c.drag*sp*lv.z+lift*.08);
  fa.applyQuaternion(a.q);fa.y-=9.81;
  a.v.addScaledVector(fa,dt);
  if(a.v.length()>c.vmax)a.v.setLength(c.vmax);
  a.p.addScaledVector(a.v,dt);
  let minY=1e9,bodyHit=false;
  for(const cp of a.CP){_a.copy(cp.v).applyQuaternion(a.q);const y=a.p.y+_a.y;if(y<minY)minY=y;if(y<0&&!cp.w)bodyHit=true}
  a.ground=minY<.05;
  if(minY<0){
    a.p.y-=minY;
    if(fly&&((bodyHit&&a.v.length()>12)||a.v.y<-6.5))crash(a);
    if(a.v.y<0)a.v.y=0;
  }
  if(a.ground&&!a.crash){
    _e.setFromQuaternion(a.q,'YXZ');
    _e.z*=Math.max(0,1-10*dt);
    if(fwd<c.rot||_e.x<0)_e.x*=Math.max(0,1-6*dt);
    _e.x=Math.min(_e.x,c.pmax);
    a.q.setFromEuler(_e);
    _q.copy(a.q).invert();
    const l=_a.copy(a.v).applyQuaternion(_q);
    l.x*=Math.max(0,1-8*dt);
    if(l.z<0){const br=pil?K.Space:ai?a.inp.brake:1,dec=.3+(br?c.brake:0);l.z=Math.min(0,l.z+dec*dt)}else l.z*=Math.max(0,1-4*dt);
    l.y=0;
    a.v.copy(l).applyQuaternion(a.q);
    if(a.v.y<0)a.v.y=0;
    if(!fly&&a.v.length()<.15)a.v.set(0,0,0);
  }
}

/* render */
let last=performance.now(),fpsT=0,fr=0,fps=60,hudT=0;
const hud=$('h1'),bar=$('bar').firstElementChild,prm=$('prompt');
const up=new T.Vector3(0,1,0),camT=new T.Vector3(),look=new T.Vector3();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min((now-last)/1000,.05);last=now;if(dt<=0)return;
  const n=Math.ceil(dt*120),h=dt/n;
  if(started)for(let i=0;i<n;i++){for(const a of A)stepPlane(a,h);if(mode==='walk')stepMan(h);stepNpc(h)}
  watch(dt);
  const fly=mode==='fly';
  for(const a of A){
    a.g.position.copy(a.p);a.g.quaternion.copy(a.q);
    const on=fly&&a===cur&&!a.crash;
    if(a.prop){a.prop.rotation.z+=(on?10+a.thr*70:0)*dt;a.disc.material.opacity=on?.12+a.thr*.12:0}
    if(a.flame){const f=on&&a.thr>.8;a.flame.visible=f;if(f)a.flame.scale.set(1,1,.8+Math.random()*.5)}
    a.pilot.visible=(fly&&a===cur)||!!a.ai;if(a.pax)a.pax.visible=npc.st==='ride'&&npc.ac===a;
    const alt=Math.max(0,a.p.y-a.c.y0);_a.set(0,0,-1).applyQuaternion(a.q);
    a.sh.position.set(a.p.x,.09,a.p.z);a.sh.rotation.y=Math.atan2(-_a.x,-_a.z);
    const sc=1+alt*.004;a.sh.scale.set(a.c.sh[0]*sc,1,a.c.sh[1]*sc);a.sh.material.opacity=clamp(.32-alt*.0006,.08,.32);
  }
  animMan(manM,man.p,man.yaw,man.anim,man.moving,!fly);
  animMan(npcM,npc.p,npc.yaw,npc.anim,npc.mv,npc.st!=='pilot'&&npc.st!=='ride');
  if(bubT>0&&!npc.mv&&npc.st!=='pilot'&&npc.st!=='ride')npcM.ar.rotation.x=-1.1+Math.sin(performance.now()/180)*.35;
  const ref=fly?cur.p:man.p;
  ground.position.set(Math.round(ref.x/TILE)*TILE,0,Math.round(ref.z/TILE)*TILE);
  if(fly){
    const c=cur.c;
    sq.slerp(cur.q,1-Math.exp(-6*dt));
    if(!drag){flyIdle+=dt;if(flyIdle>1.5){flyYaw=W(flyYaw);const kk=Math.exp(-2.2*dt);flyYaw*=kk;flyPitch*=kk}}
    camT.set(c.cam[0],c.cam[1],c.cam[2]).multiplyScalar(camZoom).applyQuaternion(_dq.setFromEuler(_e.set(-flyPitch,flyYaw,0,'YXZ'))).applyQuaternion(sq).add(cur.p);
    cam.position.lerp(camT,1-Math.exp(-18*dt));
    const ko=Math.min(1,(Math.abs(flyYaw)+Math.abs(flyPitch))*2.5);look.set(0,.5,-c.cam[2]*1.7*(1-ko)).applyQuaternion(sq).add(cur.p);
    cam.up.copy(up).lerp(_b.set(0,1,0).applyQuaternion(sq),.6).normalize();
    cam.lookAt(look);
    const fv=65+clamp(cur.v.length()*c.fovk,0,14);
    if(Math.abs(cam.fov-fv)>.1){cam.fov+=(fv-cam.fov)*Math.min(1,3*dt);cam.updateProjectionMatrix()}
  }else{
    const d=5.5*camZoom,cp=Math.cos(camPitch);
    camT.set(Math.sin(camYaw)*cp*d,Math.sin(camPitch)*d+1.5,Math.cos(camYaw)*cp*d).add(man.p);
    camT.y=Math.max(camT.y,.4);
    cam.position.lerp(camT,1-Math.exp(-16*dt));
    cam.up.set(0,1,0);cam.lookAt(man.p.x,man.p.y+1.4,man.p.z);
    if(cam.fov!==65){cam.fov=65;cam.updateProjectionMatrix()}
  }
  if(cam.position.y<.3)cam.position.y=.3;
  renderer.render(scene,cam);
  bubble(dt);
  fr++;fpsT+=dt;if(fpsT>=.5){fps=Math.round(fr/fpsT);fr=0;fpsT=0}
  hudT+=dt;
  if(hudT>.1){hudT=0;
    const a=cur,alt=Math.max(0,a.p.y-a.c.y0);
    hud.innerHTML=scoreHTML()+'FPS '+fps+(fly?'<br>'+a.c.sn+'<br>Speed '+Math.round(a.v.length()*3.6)+' km/h<br>Alt '+Math.round(alt)+' m<br>Throttle '+Math.round(a.thr*100)+'%'+(a.aoa>a.c.st&&!a.ground?'<br><b style="color:#fca5a5">STALL</b>':''):'');
    bar.style.width=(a.thr*100)+'%';syncTouch(fly,a);drawMap();bar.parentElement.style.display=fly?'block':'none';
    let t='';
    if(!a.crash){
      if(!fly){const b=nearest();if(b)t='اضغط F لركوب '+b.c.n}
      else if(a.ground&&a.v.length()<8)t='اضغط F للنزول';
    }
    if(!t&&askT>0&&!chatOpen)t='سامي ينتظر ردّك — اضغط T أو زر 💬';prm.textContent=t;prm.style.display=t?'block':'none';
  }
}
requestAnimationFrame(frame);
